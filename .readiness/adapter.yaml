# Readiness adapter (readiness/v1) — consumes the canonical contract from
# Eugene3dotdev/dotfiles readiness/.
#
# This repository holds no Linear credential. The canonical broker validates
# the readiness record for every open pull request and posts the
# `Readiness Gate` status that branch protection requires; what this
# repository proves, it publishes as a check or commit status, and the broker
# records those as evidence on the Linear issue (the `check_name` fields
# below). z3store is the substrate for the future opportunity store
# (kairoteca) and ships as a public Zig CLI plus a Homebrew formula, so source
# and build changes are `release` blast radius.
adapter: readiness-adapter/v1
contract_version: readiness/v1
repo: Eugene3dotdev/z3store
issue_prefix: TEO
canonical: Eugene3dotdev/dotfiles:readiness
path_classes:
  - glob: ".readiness/**"
    class: local
  - glob: ".github/**"
    class: local
  - glob: "doc/**"
    class: local
  - glob: "docs/**"
    class: local
  - glob: "**/*.md"
    class: local
  - glob: ".claude/**"
    class: local
  - glob: "scripts/**"
    class: local
  - glob: "tests/**"
    class: local
  - glob: ".mise.toml"
    class: local
  - glob: "package.json"
    class: local
  - glob: "bun.lock"
    class: local
  - glob: "**"
    class: release
control_points:
  - id: broker:readiness-gate
    kind: broker-status
    enforces: true
    required_check: "Readiness Gate"
    note: >-
      posted by the broker in Eugene3dotdev/dotfiles after it validates the record in Linear;
      the adapter it reads is the one on the pull request's base branch, never its head
  - id: gh:verify-pr
    kind: github-workflow
    path: .github/workflows/verify-pr.yaml
    enforces: false
    check_name: "Zig quality gate"
    evidence: [source-validation]
    note: tier 3 — cross-target matrix, safety modes, docs, bounded fuzz, evals, coverage
  - id: gh:release
    kind: github-workflow
    path: .github/workflows/release.yaml
    enforces: true
    marker: "assert-status"
    check_name: "z3store/verify-release"
    evidence: [release-verification]
    note: >-
      reads the broker's verdict back with the workflow token before running tier 4,
      then publishes the tier's result as a commit status for the broker to record
  - id: gh:claude-review
    kind: github-workflow
    path: .github/workflows/claude-review.yaml
    enforces: false
    note: agent review; the review prompt is read from the base branch and external text is untrusted data per CLAUDE.md
  - id: verify:release
    kind: verify-script
    path: scripts/verify-release.ts
    enforces: true
    marker: "runReadinessCheck"
    note: tier 4 refuses to run on an unverified record (enforce, delegated, or refuse — scripts/lib/readiness.ts)
  - id: verify:pr
    kind: verify-script
    path: scripts/verify-pr.ts
    enforces: false
    marker: "runReadinessCheck"
    note: runs the record check when a credential or offline record is configured; advisory otherwise, because the broker's status is the merge gate
  - id: verify:fast
    kind: verify-script
    path: scripts/verify-fast.ts
    enforces: false
    note: per-turn tier stays offline and fast
  - id: verify:commit
    kind: verify-script
    path: scripts/verify-commit.ts
    enforces: false
    note: per-commit tier stays offline; the Stop hook runs it
  - id: agent:claude-hooks
    kind: agent-hooks
    path: .claude/settings.json
    enforces: false
    note: session-start injects the readiness reminder; Stop runs verify-commit (tier 2)
  - id: agent:release-skill
    kind: agent-release-skill
    path: .claude/skills/release/SKILL.md
    enforces: true
    marker: "verify-release.ts"
    note: the release skill only ever runs verify-release.ts, which carries the gate
exempt_actors: []
ignore_paths:
  - "scripts/verify-*.sh"
  - ".claude/hooks/**"
