# Tier 3 quality gate. The readiness record for this change is enforced by the
# canonical broker in Eugene3dotdev/dotfiles, which posts the `Readiness Gate`
# status this repository's branch protection requires; no Linear credential
# lives here. What this workflow proves — the Zig gate, evals and coverage —
# the broker records as evidence on the Linear issue when these checks are
# green (see .readiness/adapter.yaml, `check_name`).
name: verify-pr

on:
  pull_request:
    branches:
      - main
      - dev

concurrency:
  group: verify-pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  zig-gate:
    name: Zig quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@v2
        with:
          cache: true
          install: true

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0

      - name: Install Zig 0.16.0 via mise
        run: mise install zig@0.16.0

      - name: Verify Zig toolchain resolves
        run: mise x zig@0.16.0 -- zig version

      - name: Bun install
        run: bun ci

      - name: Run verify-pr gate
        run: bun scripts/verify-pr.ts

  evals:
    name: Eval structural check
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: zig-gate
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0

      - name: Bun install
        run: bun ci

      - name: Run eval structural check
        run: bun scripts/eval.ts --check

  coverage:
    name: kcov line coverage (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: zig-gate
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install mise
        uses: jdx/mise-action@v2
        with:
          cache: true
          install: true

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.0

      - name: Install Zig 0.16.0 via mise
        run: mise install zig@0.16.0

      - name: Install kcov
        run: sudo apt-get update && sudo apt-get install -y kcov

      - name: Bun install
        run: bun ci

      - name: Measure coverage
        run: bun scripts/kcov-coverage.ts --print

      - name: Enforce coverage threshold
        run: bun scripts/check-coverage.ts

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          if-no-files-found: ignore
